<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Navin & Puja ❤️</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Intro Screen -->
<div id="intro">
  <h1>Happy Valentines Day Bebu ❤️</h1>
  <p class="tap-text">Click to enter our world</p>
</div>

<audio id="bgMusic" loop playsinline>
  <source src="song.mp3" type="audio/mpeg">
</audio>

<div id="content">

<section class="media-section">
  <img src="photo1.jpg" class="fade">
  <p class="caption">The day I knew you were my forever ❤️</p>
</section>

<section class="media-section">
  <img src="photo2.jpg" class="fade">
  <p class="caption">Distance means nothing when love means everything ❤️</p>
</section>

<section class="media-section">
  <img src="photo3.jpg" class="fade">
  <p class="caption">Every memory with you is my favorite ❤️</p>
</section>

<section class="media-section">
  <div class="video-wrapper">
    <video id="loveVideo" muted loop playsinline>
      <source src="video.mp4" type="video/mp4">
      Your browser does not support the video tag.
    </video>
  </div>
  <p class="caption" id="videoCaption">Our little movie moment 🎥</p>
</section>

</div>

<script src="script.js"></script>
</body>
</html>
